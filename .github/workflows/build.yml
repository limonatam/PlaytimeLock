name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and pack
        shell: powershell
        run: .\build.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pext
          path: dist/*.pext

      # Pushing a tag like v1.0 creates a GitHub release with the .pext attached
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pext
